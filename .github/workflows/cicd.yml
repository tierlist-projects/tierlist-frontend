name: ci

on:
  push:
    branches: [develop]
jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: duk9741/tierlist-frontend
          tags: |
            ${{github.run_number}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: |
            linux/amd64
            linux/arm64
            linux/arm/v7

      - name: Checkout Git Ops Repo
        uses: actions/checkout@v4
        with:
          repository: tierlist-projects/tierlist-git-ops
          token: ${{ secrets.GIT_PASSWORD }}

      - name: Update Git Ops Repo
        run: |
          pwd
          ls
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          sed -i "s+duk9741/tierlist-frontend.*+${{ steps.meta.outputs.tags }}+g" frontend/Deployment.yaml
          git add .
          git commit -m "action: update image tag to ${{ steps.meta.outputs.tags }}"
          git push origin main

      - name: Send Webhook to Discord
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_CICD_WEBHOOK }}
